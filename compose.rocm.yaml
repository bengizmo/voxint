# Voxint AMD (ROCm) hybrid-tier model services — overlay on compose.yaml:
#   docker compose -f compose.yaml -f compose.rocm.yaml up -d
# amd64 hosts with an AMD GPU. Only the amdgpu kernel driver is required on
# the host — the whisper `-rocm` image carries its ROCm runtime libraries.
# Same /v1 + /healthz contracts as the GPU stack (docs/gpu-contracts.md).
# No HF token needed: the diarization weights are vendored into the image.
#
# Hybrid tier, honestly stated: ASR (whisper) runs on the AMD GPU via the
# CTranslate2 ROCm build — same engine and code path as CUDA, measured 4.8×
# the CPU baseline on RDNA4. Diarization (pyannote) and speaker embedding
# (titanet) run the `-cpu` images: MIOpen convolutions fail on current AMD
# consumer GPUs in both shipping torch-ROCm wheel lines, and titanet's CPU
# path is already far faster than real-time (tracked in issue #4).
# Expected /healthz.device per service: whisper=rocm, pyannote=cpu,
# titanet=cpu.
#
# COMPUTE_TIER=rocm below is load-bearing, not cosmetic: it scales the default
# inference timeouts / stage leases / Celery visibility horizon for the
# CPU-bound stages (docs/timeouts-and-leases.md). Explicitly-set timeout env
# vars are never scaled.
#
# Do NOT set HSA_OVERRIDE_GFX_VERSION for natively supported GPUs — it
# corrupts kernel selection. See docs/operations.md for the tested host
# driver/ROCm combination.
services:
  api:
    environment:
      COMPUTE_TIER: rocm
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  worker:
    environment:
      COMPUTE_TIER: rocm
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  whisper:
    image: ghcr.io/bengizmo/voxint-whisper:${VOXINT_IMAGE_TAG:-0.17.0}-rocm
    pull_policy: missing
    # Model services self-heal after a transient crash (e.g. a load-induced
    # segfault) instead of staying down until a human intervenes (issue #23).
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    # The container runs non-root; /dev/kfd and /dev/dri/renderD* are owned
    # by the host's "render" group, whose gid is allocated per host — so it
    # must be passed numerically. The installer detects and records it in
    # .env; manual setup: VOXINT_RENDER_GID=$(stat -c %g /dev/kfd).
    # (The "video" group is NOT needed: ROCm compute uses only kfd+renderD*,
    # verified on real hardware. Docker's default seccomp profile is fine.)
    group_add:
      - "${VOXINT_RENDER_GID:-992}"
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8022:8022"

  pyannote:
    image: ghcr.io/bengizmo/voxint-pyannote:${VOXINT_IMAGE_TAG:-0.17.0}-cpu
    pull_policy: missing
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
      # Optional overrides: the default vendored pipeline is baked into the
      # image; DIARIZER_MODEL_NAME selects a different (HF) pipeline, and
      # HF_TOKEN is only used when that pipeline is gated.
      DIARIZER_MODEL_NAME: ${DIARIZER_MODEL_NAME:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
      # Cache for the optional online HF path; unused by the vendored default.
      - pyannote-models:/app/models
    ports:
      - "127.0.0.1:8024:8024"

  titanet:
    image: ghcr.io/bengizmo/voxint-titanet:${VOXINT_IMAGE_TAG:-0.17.0}-cpu
    pull_policy: missing
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8021:8021"

volumes:
  pyannote-models:
