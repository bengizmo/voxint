# Voxint CPU-tier model services — overlay on compose.yaml:
#   docker compose -f compose.yaml -f compose.cpu.yaml up -d
# No GPU required, any amd64/arm64 host (Apple Silicon via Docker Desktop,
# AMD boxes, plain servers). Same /v1 + /healthz contracts as the GPU stack
# (docs/gpu-contracts.md). No HF token needed:
# the diarization weights are vendored into the pyannote image.
#
# Honest expectation: CPU inference is SLOW — long recordings take hours.
# COMPUTE_TIER=cpu below is load-bearing, not cosmetic: it scales the default
# inference timeouts / stage leases / Celery visibility horizon so a healthy
# 4-hour transcription is never reclaimed as hung mid-stage
# (docs/timeouts-and-leases.md). Explicitly-set timeout env vars are never
# scaled.
services:
  api:
    environment:
      COMPUTE_TIER: cpu
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  worker:
    environment:
      COMPUTE_TIER: cpu
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  whisper:
    image: ghcr.io/bengizmo/voxint-whisper:${VOXINT_IMAGE_TAG:-0.30.0}-cpu
    pull_policy: missing
    # Model services self-heal after a transient crash (e.g. a load-induced
    # segfault) instead of staying down until a human intervenes (issue #23).
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
      # Hardware telemetry for the /healthz resources block (hardware-aware
      # processing). Fail-soft: disabling it or a bad interval degrades
      # telemetry, never readiness. No NVIDIA GPU here, so GPU telemetry reports
      # "unsupported"; CPU + admission telemetry still work.
      VOXINT_TELEMETRY_ENABLED: ${VOXINT_TELEMETRY_ENABLED:-1}
      VOXINT_TELEMETRY_INTERVAL_SECONDS: ${VOXINT_TELEMETRY_INTERVAL_SECONDS:-5}
      # Optional ASR override. WHISPER_MODEL defaults to the baked, offline
      # large-v2 and is never empty (the startup resolver rejects a blank model).
      # An alternate model is an unvalidated opt-in and must be fully gated
      # (WHISPER_ALLOW_DOWNLOAD=1 + a 40-char WHISPER_REVISION) or the service
      # refuses to start. WHISPER_REVISION empty-defaults for that override path;
      # on the default path the resolver restores the baked revision so the empty
      # pass-through never shadows the bake. HF_HUB_OFFLINE is NOT passed through
      # (an empty value would flip the baked default); HF_TOKEN gates only.
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v2}
      WHISPER_REVISION: ${WHISPER_REVISION:-}
      WHISPER_ALLOW_DOWNLOAD: ${WHISPER_ALLOW_DOWNLOAD:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
      # Separate cache for an alternate model; never shadows the baked large-v2.
      - whisper-models:/app/model-cache/whisper
    ports:
      - "127.0.0.1:8022:8022"

  pyannote:
    image: ghcr.io/bengizmo/voxint-pyannote:${VOXINT_IMAGE_TAG:-0.30.0}-cpu
    pull_policy: missing
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
      # Hardware telemetry for the /healthz resources block (hardware-aware
      # processing). Fail-soft: disabling it or a bad interval degrades
      # telemetry, never readiness. No NVIDIA GPU here, so GPU telemetry reports
      # "unsupported"; CPU + admission telemetry still work.
      VOXINT_TELEMETRY_ENABLED: ${VOXINT_TELEMETRY_ENABLED:-1}
      VOXINT_TELEMETRY_INTERVAL_SECONDS: ${VOXINT_TELEMETRY_INTERVAL_SECONDS:-5}
      # Optional overrides: the default vendored pipeline is baked into the
      # image; DIARIZER_MODEL_NAME selects a different (HF) pipeline, and
      # HF_TOKEN is only used when that pipeline is gated.
      DIARIZER_MODEL_NAME: ${DIARIZER_MODEL_NAME:-}
      # Optional commit pin for an overridden pipeline. Empty default is correct
      # (the vendored path ignores it); the resolver reads it only for HF repo ids.
      DIARIZER_REVISION: ${DIARIZER_REVISION:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
      # Cache for the optional online HF path; unused by the vendored default.
      - pyannote-models:/app/models
    ports:
      - "127.0.0.1:8024:8024"

  titanet:
    image: ghcr.io/bengizmo/voxint-titanet:${VOXINT_IMAGE_TAG:-0.30.0}-cpu
    pull_policy: missing
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
      # Hardware telemetry for the /healthz resources block (hardware-aware
      # processing). Fail-soft: disabling it or a bad interval degrades
      # telemetry, never readiness. No NVIDIA GPU here, so GPU telemetry reports
      # "unsupported"; CPU + admission telemetry still work.
      VOXINT_TELEMETRY_ENABLED: ${VOXINT_TELEMETRY_ENABLED:-1}
      VOXINT_TELEMETRY_INTERVAL_SECONDS: ${VOXINT_TELEMETRY_INTERVAL_SECONDS:-5}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8021:8021"

volumes:
  pyannote-models:
  whisper-models:
