[project]
name = "voxint"
version = "0.24.0"
description = "From sound to intelligence: end-to-end transcription, diarization, and speaker identity with human-grade quality gates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Voxint contributors" }]
keywords = ["transcription", "diarization", "speaker-identification", "asr", "whisper", "pyannote"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "yt-dlp>=2024.8",
    # In-process text-embedding runtime for the semantic-search spine (#121):
    # MiniLM as a vendored ONNX graph via onnxruntime + the Rust tokenizers
    # lib. Deliberately NOT torch/transformers/sentence-transformers — the
    # "NO torch/TF/CUDA" dep-closure boundary holds. onnxruntime is exact-pinned
    # to the version the titanet -cpu parity harness measures (single repo-wide
    # pin; a contract test binds it to services/titanet/requirements.cpu.txt).
    "onnxruntime==1.28.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "scipy-stubs",
]
# In-process ONNX-engine deps for the titanet parity harness
# (tests/parity/test_titanet_onnx.py); the NeMo side stays a maintainer-run
# container gate and is never installed here.
parity = [
    # Exact-pinned to the runtime the -cpu image ships
    # (services/titanet/requirements.cpu.txt) so the harness measures the
    # shipped engine, not a lookalike; a contract test binds the two.
    # KNOWN, ACCEPTED SKEW: numpy/scipy here come from the main resolution
    # (numpy 2.x) while the image pins numpy 1.24.3 — numpy 1.24 has no
    # cp312+ wheels, so exact mirroring is impossible in this venv. The
    # mel-numerics drift across numpy versions is ~1e-7 against a vector
    # gate floor of 0.9995, and the release smoke closes the gap end-to-end
    # by checking a shipped-image embedding against the committed CUDA
    # reference (tools/smoke_cpu_services.py).
    # onnxruntime itself now lives in the MAIN deps (the #121 embedder ships it
    # to every install) at the same exact pin; the parity harness reuses it.
    # Exact pins mirroring services/titanet/requirements.txt — the in-process
    # ONNX chain must run the same preprocessing stack as the shipped image,
    # or preprocess version skew masquerades as engine drift.
    "librosa==0.10.1",
    "soundfile==0.12.1",
    "noisereduce==2.0.1",
    "pyloudnorm==0.1.0",
    # librosa 0.10.1 imports pkg_resources, which setuptools removed in 81.
    "setuptools>=70,<81",
    # Whisper Metal ASR bakeoff (issue #33): the frozen WER/CER stack.
    # jiwer is the edit-distance implementation only; the text normalizer is
    # the sha-pinned vendored Whisper EnglishTextNormalizer
    # (tests/parity/bakeoff/), which imports more-itertools (number path) and
    # regex (imported by its basic.py). Exact-pinned so the frozen denominator
    # cannot move under a resolver bump; uv.lock binds the transitives
    # (click, rapidfuzz). Mirror any bump in the vendored provenance.json.
    "jiwer==4.0.0",
    "more-itertools==11.1.0",
    "regex==2026.7.19",
]
# Diarization/ASR quality harness (tools/eval_quality.py, issue #97): scores
# hypothesis RTTM against public ground truth (AMI + VoxConverse). Maintainer
# instrument only, NEVER shipped to users and NEVER installed into a service
# image. Kept in its own extra, isolated from `dev`, because pyannote.metrics
# 4.1 pulls pyannote.core>=6.0 (with numpy>=2.2.2 / scipy>=1.15.1) which
# CONFLICTS with the diarizer service's pinned pyannote.core==5.0.0
# (services/pyannote/requirements.txt) — the two never share an environment
# (the service is containerized; this harness runs in the host uv env). Do the
# optimal-mapping/collar/overlap/UEM-crop DER math with a vetted scorer, not by
# hand. Run: `uv run --isolated --extra parity --extra eval-quality
# tools/eval_quality.py …` (parity carries the frozen jiwer WER stack).
eval-quality = [
    "pyannote.metrics==4.1",
    # cpWER (concatenated minimum-permutation WER) for AMI, issue #97 commit 3.
    # meeteval brings the vetted Hungarian speaker-assignment + pooled edit
    # counts; we import only its low-level `meeteval.wer.wer.{cp,siso,error_rate}`
    # helpers (the api/CLI layer misreads a flat {speaker: text} dict as
    # {session: text} and pulls extra optional deps). Its runtime deps are
    # kaldialign/numpy/scipy/Cython/packaging — NO torch/TF/CUDA (dep-closure
    # asserted in tests/contracts/test_eval_quality_extra.py); kaldialign + Cython
    # are compiled extensions with wheels for linux-x86_64 and macos-arm64.
    "meeteval==0.4.3",
]
# Host-side synthetic-speech-detection eval scorer (tools/synthdetect_eval.py,
# issue #144): EER / bootstrap-CI / operating points / Platt calibration over a
# raw-score journal. Maintainer instrument only, NEVER shipped to users and
# NEVER installed into a service image. Kept in its own extra, isolated from the
# service runtime pins (the detector container ships pinned fairseq + torch,
# resolved separately in services/synthdetect/, and never shares this env). Only
# scikit-learn's roc_curve / roc_auc_score are used from the extra; every other
# metric (EER crossing, seeded bootstrap, Platt, Brier, reliability) is pure
# numpy in the tool, so the surface that can drift the committed fixture scores
# is a single vetted implementation. numpy is already a main dep; it is listed
# here so the extra is self-contained. Run: `uv run --isolated --extra
# synthdetect-eval tools/synthdetect_eval.py score …`.
synthdetect-eval = [
    "numpy>=1.26",
    "scikit-learn>=1.4,<2",
]

[project.scripts]
voxint = "voxint.cli:main"

[project.urls]
Repository = "https://github.com/bengizmo/voxint"
Issues = "https://github.com/bengizmo/voxint/issues"
Documentation = "https://github.com/bengizmo/voxint/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The prebuilt frontend island bundles (issue #48) that the Dockerfile's Node
# stage writes into src/voxint/api/static/app ARE git-ignored (kept out of commits
# for a clean tree; see .gitignore's static/app rule, added with #69). `artifacts`
# here — set globally so it applies to BOTH the sdist and the wheel (uv builds the
# wheel from the sdist, so a wheel-only artifacts entry is dropped) — explicitly
# re-includes them; otherwise hatchling's VCS-ignore drops them and the wheel
# ships only static/app/.gitkeep, leaving the review console unable to hydrate its
# islands. This is NOT force-include (which would double-add files already inside
# the packaged tree and abort the build); `artifacts` only un-ignores.
[tool.hatch.build]
artifacts = [
    "src/voxint/api/static/app/assets/**/*",
    "src/voxint/api/static/app/.vite/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voxint"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Verbatim, sha-pinned upstream code (openai/whisper normalizers): its integrity
# check is the digest in the sibling provenance.json, not lint. Keeping it
# byte-identical is what makes the vendored hashes meaningful. force-exclude so
# the dir is skipped even when its files are passed explicitly (pre-commit,
# ad-hoc `ruff check <path>`), not only during a directory scan.
extend-exclude = ["tests/parity/bakeoff/_vendor/openai_whisper_normalizers"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep alembic's line formatting.
"alembic/versions/*" = ["E501", "W291"]
# The model-service images build on nvidia/cuda:*-ubuntu22.04 (system Python
# 3.10), but the repo-wide ruff target is py311. UP017 rewrites `timezone.utc`
# to the 3.11+-only `datetime.UTC`, which crash-loops the CUDA image at import
# (the v0.22.0 model-service boot bug). Keep pyupgrade off the py3.10 service
# code; the static guard in tests/contracts/test_resource_telemetry.py backs it.
"services/*/app/*.py" = ["UP017"]

[tool.mypy]
strict = true
packages = ["voxint"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true

# The in-process text embedder (#121) runtime deps ship no type stubs.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

# scikit-learn (synthdetect-eval extra, tools/synthdetect_eval.py) ships no
# py.typed marker; only its roc_curve/roc_auc_score are used, behind lazy imports.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

# torch + fairseq are the synthdetect eval-container runtime (tools/synthdetect_infer.py,
# issue #144): they live ONLY inside services/synthdetect/Dockerfile.eval, never in the
# host env or the voxint package, and are imported lazily so the pure runner orchestration
# type-checks and runs without them. No stubs on the host; ignore the missing imports.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "fairseq", "fairseq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src/voxint"]

[tool.coverage.report]
fail_under = 85
