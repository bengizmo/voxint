# Voxint core stack — Postgres+pgvector, Redis, API (+ review UI), Celery worker.
# GPU model services live in compose.gpu.yaml:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
name: voxint

# The default stack runs the pinned RELEASE image below — even on a `main`
# checkout. To run the code you have checked out, layer compose.build.yaml
# (and compose.gpu.build.yaml for the model services). Exactly-pinned version,
# never `latest`: an unpinned quickstart re-resolves under users' feet.
# One shared image for migrate/api/worker/beat; VOXINT_IMAGE_TAG in .env
# overrides the pin (e.g. to run a newer release without editing this file).
x-voxint-app: &voxint-app
  image: ghcr.io/bengizmo/voxint:${VOXINT_IMAGE_TAG:-0.1.0}
  pull_policy: missing

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voxint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxint}
      POSTGRES_DB: ${POSTGRES_DB:-voxint}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # $$ defers expansion to the container shell, where POSTGRES_USER/DB are set.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: brings the schema to alembic head, then exits. `Exited (0)` in
  # `docker compose ps -a` is the SUCCESS state, not a crash — api/worker only
  # start after it completes (see their depends_on). Re-runs on every `up` and
  # no-ops when already at head. Diagnose failures with:
  #   docker compose logs migrate
  # Manual fallback: docker compose run --rm migrate
  migrate:
    <<: *voxint-app
    command: alembic upgrade head
    restart: "no"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voxint}:${POSTGRES_PASSWORD:-voxint}@postgres:5432/${POSTGRES_DB:-voxint}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *voxint-app
    command: voxint serve
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voxint}:${POSTGRES_PASSWORD:-voxint}@postgres:5432/${POSTGRES_DB:-voxint}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
      # In-container bind is all-interfaces (published to host loopback
      # below); the settings validator therefore REQUIRES a real password.
      API_HOST: 0.0.0.0
      # Container-internal port is pinned; API_PORT from .env moves the HOST
      # side of the publish below (and the bare-host bind), never this bind.
      API_PORT: "8080"
      VOXINT_PASSWORD: ${VOXINT_PASSWORD:?set VOXINT_PASSWORD in .env (see .env.example)}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *voxint-app
    command: celery -A voxint.worker.app worker --loglevel=INFO
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voxint}:${POSTGRES_PASSWORD:-voxint}@postgres:5432/${POSTGRES_DB:-voxint}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Celery beat: schedules the periodic recovery sweep that reclaims expired
  # stage leases and broker-lost QUEUED runs (the worker executes the sweep).
  # Without this process, crash recovery never happens. A dedicated service —
  # not `worker --beat` — so a worker restart can't silently take the
  # scheduler down with it. `-s` points the schedule file somewhere the
  # unprivileged container user can write.
  beat:
    <<: *voxint-app
    command: celery -A voxint.worker.app beat --loglevel=INFO -s /tmp/celerybeat-schedule
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
