# Voxint GPU model services — overlay on compose.yaml:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
# One NVIDIA GPU assumed; all three share it. Contracts: /v1/transcribe, /v1/diarize, /v1/embed, /healthz
# (docs/gpu-contracts.md). pyannote requires HF_TOKEN in .env for its HF-gated weights.
services:
  # Inside the compose network the model services are reached by service DNS name,
  # overriding the localhost defaults meant for bare-host development.
  api:
    environment:
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  worker:
    environment:
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  whisper:
    image: ghcr.io/bengizmo/voxint-whisper:${VOXINT_IMAGE_TAG:-0.2.0}
    pull_policy: missing
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8022:8022"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  pyannote:
    image: ghcr.io/bengizmo/voxint-pyannote:${VOXINT_IMAGE_TAG:-0.2.0}
    pull_policy: missing
    environment:
      MEDIA_ROOT: /data/media
      HF_TOKEN: ${HF_TOKEN:?pyannote weights are HF-gated - set HF_TOKEN in .env}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
      # Gated weights download at first startup; persist them across recreates.
      - pyannote-models:/app/models
    ports:
      - "127.0.0.1:8024:8024"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  titanet:
    image: ghcr.io/bengizmo/voxint-titanet:${VOXINT_IMAGE_TAG:-0.2.0}
    pull_policy: missing
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8021:8021"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pyannote-models:
