# Voxint GPU model services — overlay on compose.yaml:
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d
# One NVIDIA GPU assumed; all three share it. Contracts: /v1/transcribe, /v1/diarize, /v1/embed, /healthz
# (docs/gpu-contracts.md). No HF token needed: diarization weights are vendored.
services:
  # Inside the compose network the model services are reached by service DNS name,
  # overriding the localhost defaults meant for bare-host development.
  api:
    environment:
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  worker:
    environment:
      ASR_URL: http://whisper:8022
      DIARIZER_URL: http://pyannote:8024
      EMBEDDER_URL: http://titanet:8021

  whisper:
    image: ghcr.io/bengizmo/voxint-whisper:${VOXINT_IMAGE_TAG:-0.16.0}
    pull_policy: missing
    # Model services self-heal after a transient crash (e.g. a load-induced
    # segfault) instead of staying down until a human intervenes (issue #23).
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8022:8022"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  pyannote:
    image: ghcr.io/bengizmo/voxint-pyannote:${VOXINT_IMAGE_TAG:-0.16.0}
    pull_policy: missing
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
      # Optional overrides: the default vendored pipeline is baked into the
      # image; DIARIZER_MODEL_NAME selects a different (HF) pipeline, and
      # HF_TOKEN is only used when that pipeline is gated.
      DIARIZER_MODEL_NAME: ${DIARIZER_MODEL_NAME:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
      # Cache for the optional online HF path; unused by the vendored default.
      - pyannote-models:/app/models
    ports:
      - "127.0.0.1:8024:8024"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  titanet:
    image: ghcr.io/bengizmo/voxint-titanet:${VOXINT_IMAGE_TAG:-0.16.0}
    pull_policy: missing
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /data/media
    volumes:
      - ${MEDIA_ROOT:-./media}:/data/media:ro
    ports:
      - "127.0.0.1:8021:8021"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  pyannote-models:
