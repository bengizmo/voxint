# Runs on GitHub Actions and Forgejo Actions (both read .github/workflows).
# Gitleaks is invoked as a pinned CLI (not gitleaks-action) so the same step works on both platforms.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default token (audit F2). Every job here only reads; grant
# more per-job if one ever needs it. Note: this scopes the GitHub lane only —
# the Forgejo Actions mirror ignores `permissions` and its token is write-capable.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  # sha256 of gitleaks_8.24.3_linux_x64.tar.gz (audit F4). Coupled to
  # GITLEAKS_VERSION on purpose: a version bump that forgets this digest
  # fails the checksum verification closed.
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  # Fast required gate: static checks + the whole suite WITHOUT coverage
  # instrumentation. Coverage (~33% wall-clock tax, measured) moved to the
  # parallel `coverage` job below so it stays off the critical path. The
  # DB-backed integration layer runs under pytest-xdist with one disposable
  # database per worker (tests/integration/conftest.py), so it uses the runner's
  # cores instead of serializing on a single shared DROP SCHEMA.
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: voxint
          POSTGRES_PASSWORD: voxint
          POSTGRES_DB: voxint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra dev --extra parity
      - name: Install ffmpeg (normalize-stage tests)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      # Fast lane: DB-free suites, parallelized. Kept as its own invocation from
      # the integration lane so the session-long DATABASE_URL that the
      # integration fixtures set can never ride into these processes.
      - name: Pytest (unit + contracts)
        run: uv run pytest tests/unit tests/contracts -n auto
      # Numerics parity gate — left serial and unchanged (not xdist'd).
      - name: Pytest (parity)
        run: uv run pytest tests/parity
      # Integration lane: one disposable database per xdist worker. -n 8 is the
      # maintainer default (see docs/testing.md); on a small runner the
      # workers timeshare cores but each still gets an isolated DB.
      - name: Pytest (integration)
        env:
          VOXINT_TEST_DATABASE_URL: postgresql+psycopg://voxint:voxint@localhost:5432/voxint_test
        run: uv run pytest tests/integration -n 8

  # Required, and runs in PARALLEL with lint-test so coverage never gates fast
  # feedback. pytest-cov automatically combines the xdist workers' data; the 85%
  # floor is enforced by [tool.coverage.report] fail_under in pyproject.toml.
  # NOTE: add this job to the branch-protection required-checks set alongside
  # `lint-test` and `secrets-scan`.
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: voxint
          POSTGRES_PASSWORD: voxint
          POSTGRES_DB: voxint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxint"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra dev --extra parity
      - name: Install ffmpeg (normalize-stage tests)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Pytest (full suite, coverage)
        env:
          VOXINT_TEST_DATABASE_URL: postgresql+psycopg://voxint:voxint@localhost:5432/voxint_test
        run: uv run pytest tests --cov=voxint -n 8

  frontend:
    # Independent of lint-test (no `needs:`): a frontend break blocks merge on
    # its own signal without coupling to the Postgres service container. The
    # no-CDN offline guarantee rides inside `npm run build` (checks the exact
    # dist/ bytes the image COPYs). Make this a required check on main.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build          # tsc --noEmit + vite build + check-no-cdn-urls
      - name: Audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # Download to a file, verify sha256 against the repo-held literal
          # digest, then extract only after verification (audit F4). No
          # curl-pipe-to-tar: an unverified body must never reach tar.
          curl --fail --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
          rm -f "$RUNNER_TEMP/gitleaks.tar.gz"
      - name: Gitleaks (history + worktree)
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose .
          gitleaks dir --config .gitleaks.toml --redact --verbose .
