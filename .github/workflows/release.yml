# Publishes prebuilt images to GHCR on version tags (v0.1.0, ...).
# Runs only on the GitHub mirror: the server_url guard below skips every job
# elsewhere, so if the Forgejo instance happens to parse .github/workflows it
# stays a no-op there (Forgejo has no GHCR credentials and never needs them).
# Auth is the workflow-scoped GITHUB_TOKEN (packages: write); no extra secrets.
#
# Flavor matrix (docs/gpu-contracts.md + the non-NVIDIA plan):
#   unsuffixed  = CUDA model-service images, amd64 (publish-images, unchanged)
#   -cpu        = CPU model-service images, multi-arch amd64+arm64
#   voxint      = api/worker app image, multi-arch amd64+arm64, unsuffixed
# Multi-arch images are built NATIVELY per arch (ubuntu-24.04-arm, no QEMU —
# torch-sized builds are impractical under emulation) and pushed by digest
# only. Ordering is deliberate: parity-gate → build → SMOKE (per-arch, against
# the untagged digests) → merge — release tags never exist for images that
# have not passed their smoke, so a failed smoke leaves nothing public.
#
# Release gates wired here:
#   parity-gate — the strict titanet ONNX parity harness
#     (VOXINT_PARITY_REQUIRED=1) on BOTH arches; blocks every multi-arch build.
#     The NeMo/CUDA side of the parity story stays a maintainer-run container
#     gate (tools/generate_parity_references.py) — GitHub has no GPU runners.
#   smoke-cpu — per arch, by digest: healthz identity fields, a real corpus
#     transcription, and a titanet embedding checked against the committed
#     CUDA reference vector (tools/smoke_cpu_services.py) — the ONNX graph
#     provably executes on the shipped numerical stack. pyannote's HF-gated
#     smoke needs secrets.HF_TOKEN: present → real diarization; absent →
#     explicit SKIP in the step summary, never a false pass.
#
# The ~100 MB titanet .onnx is NOT in git: jobs fetch it from the standing
# model-asset release (TITANET_ONNX_RELEASE) and verify its sha256 against
# tests/parity/fixtures/onnx/provenance.json before use. A re-export bumps
# the asset release AND provenance together.
name: release

on:
  push:
    tags: ["v*"]

env:
  TITANET_ONNX_RELEASE: titanet-onnx-v1

jobs:
  # CUDA images — byte-identical build steps to previous releases; amd64-only.
  # (The voxint app image moved to the multi-arch pipeline below.)
  publish-images:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # A release cut should publish every image it can; one failing build
      # must not cancel the siblings mid-push.
      fail-fast: false
      matrix:
        include:
          - image: voxint-whisper
            context: services/whisper
          - image: voxint-pyannote
            context: services/pyannote
          - image: voxint-titanet
            context: services/titanet
    steps:
      - uses: actions/checkout@v4
      # The CUDA-based model-service images are large; reclaim runner disk
      # before building so the GPU matrix entries don't fail on space.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Strict titanet ONNX parity on both arches. Blocks every multi-arch build:
  # shipping a -cpu titanet whose engine drifted from the CUDA embedding space
  # is the one unrecoverable failure mode (silent space drift).
  parity-gate:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install libsndfile (soundfile 0.12.1 ships no aarch64 wheel lib)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libsndfile1
      - name: Install (dev + parity extras)
        run: uv sync --frozen --extra dev --extra parity
      - name: Fetch the exported graph (model-asset release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p services/titanet/models
          gh release download "$TITANET_ONNX_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern titanet-large.onnx \
            --output services/titanet/models/titanet-large.onnx
      - name: Verify artifact against committed provenance
        run: |
          expected=$(python3 -c "import json; print(json.load(open('tests/parity/fixtures/onnx/provenance.json'))['onnx_sha256'])")
          echo "${expected}  services/titanet/models/titanet-large.onnx" | sha256sum -c -
      - name: Parity harness (strict — missing prerequisites hard-fail)
        env:
          VOXINT_PARITY_REQUIRED: "1"
        run: uv run pytest tests/parity -q

  # Native per-arch builds, pushed by digest only (no tags yet). Tags land in
  # merge-multiarch after the digest images pass smoke-cpu.
  # matrix.target.artifact keys the digest artifacts: names must never be a
  # prefix of a sibling's, or merge-multiarch's download pattern would sweep
  # up the sibling's digests and corrupt the manifest list (this bit the
  # first draft: "digests-voxint-*" matched every voxint-*-cpu artifact).
  build-multiarch:
    if: github.server_url == 'https://github.com'
    needs: parity-gate
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: voxint
            artifact: app
            context: .
            dockerfile: Dockerfile
            suffix: ""
          - image: voxint-whisper
            artifact: whisper-cpu
            context: services/whisper
            dockerfile: Dockerfile.cpu
            suffix: -cpu
          - image: voxint-pyannote
            artifact: pyannote-cpu
            context: services/pyannote
            dockerfile: Dockerfile.cpu
            suffix: -cpu
          - image: voxint-titanet
            artifact: titanet-cpu
            context: services/titanet
            dockerfile: Dockerfile.cpu
            suffix: -cpu
        platform:
          - runner: ubuntu-latest
            arch: amd64
            docker: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            docker: linux/arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Fetch the exported graph (titanet only)
        if: matrix.target.image == 'voxint-titanet'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p services/titanet/models
          gh release download "$TITANET_ONNX_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern titanet-large.onnx \
            --output services/titanet/models/titanet-large.onnx
          # The Dockerfile re-verifies against its baked provenance sha; this
          # early check just fails faster with a clearer message.
          expected=$(python3 -c "import json; print(json.load(open('tests/parity/fixtures/onnx/provenance.json'))['onnx_sha256'])")
          echo "${expected}  services/titanet/models/titanet-large.onnx" | sha256sum -c -
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag output is unused here (digest-only push); this exists so the
      # per-arch builds carry the same OCI labels as the CUDA images.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ matrix.target.context }}
          file: ${{ matrix.target.context }}/${{ matrix.target.dockerfile }}
          platforms: ${{ matrix.platform.docker }}
          labels: ${{ steps.meta.outputs.labels }}
          # Digest-only push; merge-multiarch attaches the tags after smoke.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.image }}${{ matrix.target.suffix }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=${{ matrix.target.image }}${{ matrix.target.suffix }}-${{ matrix.platform.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target.artifact }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Boot + real-inference smoke of the UNTAGGED digest images, natively per
  # arch, BEFORE any tag exists. tools/smoke_cpu_services.py asserts healthz
  # identity, a real transcription, and a titanet embedding within cosine
  # 0.999 of the committed CUDA reference — not just liveness.
  smoke-cpu:
    if: github.server_url == 'https://github.com'
    needs: build-multiarch
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: digests-app-${{ matrix.platform.arch }}
          path: /tmp/digests/app
      - uses: actions/download-artifact@v4
        with:
          name: digests-whisper-cpu-${{ matrix.platform.arch }}
          path: /tmp/digests/whisper
      - uses: actions/download-artifact@v4
        with:
          name: digests-pyannote-cpu-${{ matrix.platform.arch }}
          path: /tmp/digests/pyannote
      - uses: actions/download-artifact@v4
        with:
          name: digests-titanet-cpu-${{ matrix.platform.arch }}
          path: /tmp/digests/titanet
      - name: App image boots and imports
        run: |
          owner="ghcr.io/${{ github.repository_owner }}"
          digest=$(ls /tmp/digests/app)
          docker run --rm "${owner}/voxint@sha256:${digest}" \
            python -c "import voxint; print('voxint', voxint.__version__)"
      - name: Boot model services from digests
        run: |
          owner="ghcr.io/${{ github.repository_owner }}"
          media="$PWD/tests/parity/fixtures/corpus"
          docker run -d --name whisper -p 8022:8022 -v "$media:/data/media:ro" \
            "${owner}/voxint-whisper@sha256:$(ls /tmp/digests/whisper)"
          docker run -d --name titanet -p 8021:8021 -v "$media:/data/media:ro" \
            "${owner}/voxint-titanet@sha256:$(ls /tmp/digests/titanet)"
          if [ -n "${HF_TOKEN}" ]; then
            docker run -d --name pyannote -p 8024:8024 -v "$media:/data/media:ro" \
              -e HF_TOKEN "${owner}/voxint-pyannote@sha256:$(ls /tmp/digests/pyannote)"
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Wait for healthz
        run: |
          trap 'echo "--- whisper logs:"; docker logs whisper || true; echo "--- titanet logs:"; docker logs titanet || true; docker logs pyannote 2>/dev/null || true' ERR
          wait_for() {  # name url max_iterations (5s apart)
            for i in $(seq 1 "$3"); do
              curl -sf "$2/healthz" > /dev/null && return 0
              sleep 5
            done
            echo "$1 never became healthy" >&2
            return 1
          }
          wait_for whisper http://localhost:8022 90
          wait_for titanet http://localhost:8021 60
          if docker ps --format '{{.Names}}' | grep -q '^pyannote$'; then
            wait_for pyannote http://localhost:8024 90
          fi
      - name: Smoke (real inference vs committed references)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          trap 'echo "--- whisper logs:"; docker logs whisper || true; echo "--- titanet logs:"; docker logs titanet || true; docker logs pyannote 2>/dev/null || true' ERR
          extra=""
          if [ -n "${HF_TOKEN}" ]; then
            extra="--pyannote http://localhost:8024"
          else
            echo "::warning::pyannote smoke SKIPPED — no HF_TOKEN secret configured (weights are HF-gated)"
            echo "### pyannote smoke: SKIPPED (no HF_TOKEN secret)" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/smoke_cpu_services.py \
            --fixtures tests/parity/fixtures \
            --whisper http://localhost:8022 \
            --titanet http://localhost:8021 \
            $extra

  # Only smoke-passed digests get tags. Names must match the build-multiarch
  # artifact keys exactly (see the prefix-collision note there).
  merge-multiarch:
    if: github.server_url == 'https://github.com'
    needs: smoke-cpu
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: voxint
            artifact: app
            suffix: ""
          - image: voxint-whisper
            artifact: whisper-cpu
            suffix: -cpu
          - image: voxint-pyannote
            artifact: pyannote-cpu
            suffix: -cpu
          - image: voxint-titanet
            artifact: titanet-cpu
            suffix: -cpu
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target.artifact }}-*
          merge-multiple: true
      - name: Exactly one digest per arch
        working-directory: /tmp/digests
        run: |
          count=$(ls -1 | wc -l)
          test "$count" -eq 2 || { echo "expected exactly 2 digests, got $count: $(ls -1)"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}
          flavor: |
            suffix=${{ matrix.target.suffix }},onlatest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/${{ matrix.target.image }}@sha256:%s ' *)
      - name: Verify manifest platforms
        # .tags[0], not outputs.version — version is unsuffixed, and for the
        # -cpu images the unsuffixed tag is the CUDA sibling.
        run: |
          tag="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          docker buildx imagetools inspect --raw "$tag" \
            | jq -e '[.manifests[] | select(.platform.os != "unknown") | .platform.os + "/" + .platform.architecture] | sort == ["linux/amd64", "linux/arm64"]'
