# Voxint secret + clean-room provenance scanning.
# Extends the gitleaks default ruleset with rules that enforce the copy-discipline for code
# transplanted from the private upstream monorepo: no private IPs, internal hostnames,
# NAS paths, or upstream-domain strings may land in this repository.
[extend]
useDefault = true

[[rules]]
id = "voxint-rfc1918-address"
description = "Private RFC1918 IP address (internal infrastructure leak)"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''
[rules.allowlist]
# The three canonical RFC1918 range identifiers in their network-address + CIDR
# form are legitimate documentation (the #16 restricted-egress NetworkPolicy
# denies exactly these ranges). A range identifier like 192.168.0.0/16 is the
# definition of the private space, never a real internal host (which would be
# 192.168.<x>.<y> with a non-zero host part), so exempting these exact strings
# does not weaken the leak guard. Named individually per the anti-broad-pattern
# doctrine; a bare host address in any range is still flagged everywhere.
# regexTarget = "line": the rule captures only the bare address as the secret, so
# the allowlist must match on the whole line. Each pattern is anchored to a YAML
# list item that is ONLY the range identifier (as at docs/operations.md), so a
# real host is still flagged even on a line that also mentions a range: a mid-line
# prose CIDR is deliberately fail-closed and must be re-exempted on purpose.
regexTarget = "line"
regexes = [
    '''^\s*-\s*10\.0\.0\.0/8\s*$''',
    '''^\s*-\s*172\.16\.0\.0/12\s*$''',
    '''^\s*-\s*192\.168\.0\.0/16\s*$''',
]

[[rules]]
id = "voxint-internal-hostname"
description = "Internal hostname or service DNS from the private upstream environment"
regex = '''(?i)\b(thinktank|darkboi|smolboi|worker-node-beast|gpu-workstation-1|ben-control-plane|tealmaker|compendium[-_](core|av|ai|classification|scrapers)|\.svc\.cluster\.local)\b'''

[[rules]]
id = "voxint-nas-path"
description = "Private NAS / node filesystem path"
regex = '''(/mnt/nas2?/|/mnt/audio-ssd|/volume[0-9]/app_data)'''

[[rules]]
id = "voxint-upstream-domain-strings"
description = "Upstream private-domain strings (project identity / IP leak)"
regex = '''(?i)\b(hvac|fullstackhvac|compendium)\b'''
[rules.allowlist]
# "hvac" is used as a benign, generic example domain-pack value in the #104
# sidecar test/doc fixtures (a demo vertical, not maintainer identity). Exempt
# these three files from THIS rule only; every other gitleaks rule still scans
# them in full, and the path scope keeps "hvac"/"fullstackhvac"/"compendium"
# guarded everywhere else. Path-scoped (not fingerprint) so it clears both the
# worktree and the published #104 history commit without a history rewrite.
paths = [
    '''^\.gitleaks\.toml$''',
    '''(^|/)docs/how-to/add-media-and-manage-runs\.md$''',
    '''(^|/)tests/integration/test_watch_sweep\.py$''',
    '''(^|/)tests/unit/test_sidecar\.py$''',
]

[allowlist]
description = "Repo-level allowlist"
paths = [
    '''^\.gitleaks\.toml$''',
    '''(^|/)uv\.lock$''',
    # The nested PRIVATE maintainer-notes repo (gitignored, never part of this
    # repo's git): hostnames are allowed there by design, and `gitleaks dir .`
    # scans the filesystem regardless of .gitignore. The `git` scan still
    # covers everything actually committed here.
    '''^internal/''',
]
# Deliberately secret-SHAPED fake tokens in the installer test suite: the tests
# assert these values never reach stdout/stderr/argv, so they must look like
# real hf_ tokens. Named individually — never allowlist a broad hf_ pattern.
#
# WHISPER_AHEADS_LARGE_V2 is the public whisper.cpp DTW alignment-heads preset
# macro name (a documented upstream constant, not a credential); the
# generic-api-key rule flags its length/shape. Named individually — never
# allowlist a broad WHISPER_* pattern.
#
# "elapsed/duration" is benign English prose in the #89 console-UX design report
# (docs/reports/console-ux-modernization-design-2026-08-19.md) describing an
# audio-transport a11y surface; the generic-api-key rule mis-flags the two words
# joined by a slash. Named individually — never allowlist a broad prose pattern.
regexes = [
    '''hf_(TESTSECRETTOKEN123|NEWSECRET456|PREFLIGHTSECRET789)''',
    '''WHISPER_AHEADS_LARGE_V2''',
    '''elapsed/duration''',
]
# 29ce5b5a: parity doc/test comments named the measurement host (a bare machine
# nickname — no address or credential). Scrubbed from the worktree in the v0.4.0
# release commit; the historical commit is allowlisted because published history
# is never rewritten.
# 33c4dc2a: #12 notify tests used an RFC1918 literal (10.0.0.5) as a fixture for
# the "reject non-public webhook URL" case — a fake example IP, not internal
# infrastructure. Scrubbed to an RFC 5737 TEST-NET address in the v0.14.0 release
# commit; the historical commit is allowlisted because published history is never
# rewritten.
commits = [
    "29ce5b5a3c0b2a65c5442c467ca5b8c1b177bcfc",
    "33c4dc2a01934f9a534b3658c5c71e3e861a73e5",
]
