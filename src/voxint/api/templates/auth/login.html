<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Voxint</title>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #fff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error-bg: #fef2f2;
    --error-text: #991b1b;
    --error-border: #fca5a5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --muted: #999;
      --border: #333;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --error-bg: #2a1515;
      --error-text: #fca5a5;
      --error-border: #991b1b;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .login-card label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.25rem;
    color: var(--muted);
  }
  .login-card input[type="text"],
  .login-card input[type="password"] {
    width: 100%;
    padding: 0.5rem 0.75rem;
    font-size: 0.9375rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 1rem;
  }
  .login-card input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  .login-card button {
    width: 100%;
    padding: 0.625rem;
    font-size: 0.9375rem;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .login-card button:hover {
    background: var(--accent-hover);
  }
  .error-banner {
    background: var(--error-bg);
    color: var(--error-text);
    border: 1px solid var(--error-border);
    border-radius: 4px;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
<div class="login-card">
  <h1>Voxint</h1>
  {% if error %}
  <div class="error-banner">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required
           {% if submitted_username %}value="{{ submitted_username }}"{% endif %}>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
