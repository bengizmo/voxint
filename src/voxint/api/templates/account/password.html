{% extends "base.html" %}
{% block title %}Voxint — change password{% endblock %}
{% block body %}
<div class="settings">
<h1>Change password</h1>

{% if ok %}
<p class="notice notice--ok" role="status">{{ ok }}</p>
{% endif %}
{% if error %}
<p class="notice" role="alert">{{ error }}</p>
{% endif %}

<p class="muted">Changing your password will sign out all other sessions.</p>

<form method="post" action="/account/password" class="stacked-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-field">
    <label for="current-password">Current password</label>
    <input type="password" id="current-password" name="current_password" required
           autocomplete="current-password">
  </div>
  <div class="form-field">
    <label for="new-password">New password</label>
    <input type="password" id="new-password" name="new_password" required
           autocomplete="new-password" minlength="1">
  </div>
  <div class="form-field">
    <label for="new-password-confirm">Confirm new password</label>
    <input type="password" id="new-password-confirm" name="new_password_confirm" required
           autocomplete="new-password" minlength="1">
  </div>
  <button type="submit" class="btn">Change password</button>
</form>
</div>
{% endblock %}
